<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>LocalCast Login</title>

</head>

<body style="
    margin:0;
    background:#0f172a;
    font-family:Arial;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
">

    <div style="
        width:340px;
        background:white;
        border-radius:20px;
        padding:40px;
        box-shadow:0 10px 30px rgba(0,0,0,0.25);
    ">

        <h1 style="
            margin-top:0;
            margin-bottom:10px;
            color:#0f172a;
        ">
            LocalCast
        </h1>

        <p style="
            color:#64748b;
            margin-bottom:30px;
        ">
            Вход в административную панель
        </p>

        {% if error %}

            <div style="
                background:#fee2e2;
                color:#b91c1c;
                padding:12px;
                border-radius:10px;
                margin-bottom:20px;
                font-size:14px;
            ">
                {{ error }}
            </div>

        {% endif %}

        <form method="post" action="/login">

            <input
                type="text"
                name="username"
                placeholder="Логин"
                required
                style="
                    width:100%;
                    padding:14px;
                    margin-bottom:16px;
                    border:1px solid #cbd5e1;
                    border-radius:10px;
                    box-sizing:border-box;
                ">

            <input
                type="password"
                name="password"
                placeholder="Пароль"
                required
                style="
                    width:100%;
                    padding:14px;
                    margin-bottom:20px;
                    border:1px solid #cbd5e1;
                    border-radius:10px;
                    box-sizing:border-box;
                ">

            <button
                type="submit"
                style="
                    width:100%;
                    background:#2563eb;
                    color:white;
                    border:none;
                    padding:14px;
                    border-radius:10px;
                    cursor:pointer;
                    font-size:15px;
                ">

                Войти

            </button>

        </form>

    </div>

</body>

</html>
